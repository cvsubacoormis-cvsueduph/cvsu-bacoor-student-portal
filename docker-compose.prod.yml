name: cvsu-prod

services:
  redis:
    image: redis:7-alpine
    container_name: cvsu-portal-redis-prod
    ports:
      - "6380:6379"
    volumes:
      - redis-data-prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      - prod-network

  app:
    build:
      context: .
      # `docker compose --env-file .env` only feeds the compose file itself and
      # the container's runtime env — it does NOT reach `docker build`. These are
      # required because `next build` inlines NEXT_PUBLIC_* into the client
      # bundle and prerenders pages wrapped in <ClerkProvider>.
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    ports:
      - "3013:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: cvsu-portal-redis-prod
      REDIS_PORT: 6379
      HOST: 0.0.0.0
      # Must stay in sync with the container side of `ports` and with the
      # healthcheck URL below. `next start` binds to $PORT, so a mismatch here
      # makes the probe hit a closed port and the container reports unhealthy
      # even while the app serves traffic normally.
      PORT: 3001
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - prod-network

networks:
  prod-network:
    driver: bridge

volumes:
  redis-data-prod:
